name: Node.js CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Validate Compose configuration
        run: docker compose -f labs/hello-service/compose.yaml config --quiet
      - name: Build container lab
        run: docker compose -f labs/hello-service/compose.yaml build
      - name: Start container lab
        run: docker compose -f labs/hello-service/compose.yaml up -d
      - name: Verify health endpoint
        run: |
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health | grep -q '"status":"ok"'; then exit 0; fi
            sleep 2
          done
          docker compose -f labs/hello-service/compose.yaml logs
          exit 1
      - name: Verify container resource limits
        run: |
          container_id=$(docker compose -f labs/hello-service/compose.yaml ps -q hello)
          test -n "$container_id"
          docker inspect "$container_id" --format '{{json .HostConfig}}' > /tmp/hostconfig.json
          node - <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const cfg = JSON.parse(fs.readFileSync('/tmp/hostconfig.json', 'utf8'));
          assert.equal(cfg.Memory, 134217728, 'memory limit must be 128 MiB');
          assert.equal(cfg.NanoCpus, 500000000, 'CPU limit must be 0.5 core');
          assert.equal(cfg.PidsLimit, 100, 'PID limit must be 100');
          console.log('Container limits verified: 128 MiB, 0.5 CPU, 100 PIDs');
          NODE
      - name: Verify health endpoint returns valid JSON
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          (async () => {
            const response = await fetch('http://127.0.0.1:8080/health');
            assert.equal(response.status, 200);
            const body = await response.json();
            assert.equal(body.status, 'ok');
            console.log('Health endpoint JSON contract verified');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Stop lab
        if: always()
        run: docker compose -f labs/hello-service/compose.yaml down
